<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Cadastrar QR Codes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- <link rel="stylesheet" href="qr_admin.css"> -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            background-color: #4a6fa5;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1,
        h2 {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .panel {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        #qr-reader {
            width: 100%;
            border: 2px solid #ddd;
            border-radius: 8px;
        }

        .feedback-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            border: 1px solid #ddd;
        }

        .feedback-box.success {
            background-color: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
        }

        .feedback-box.error {
            background-color: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }

        .assignment-area h2 {
            justify-content: flex-start;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .form-group input:read-only {
            background-color: #e9ecef;
            cursor: not-allowed;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background-color: #28a745;
            color: white;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        button:not(:disabled):hover {
            background-color: #218838;
        }

        @media (max-width: 768px) {
            .panel {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-qrcode"></i> Ferramenta de Cadastro de QR Codes</h1>
        </header>
        <main class="panel">
            <div class="scanner-area">
                <div id="qr-reader"></div>
                <div id="scanner-feedback" class="feedback-box">
                    Aponte a câmera para um QR Code...
                </div>
            </div>
            <div class="assignment-area">
                <h2>Vincular Código ao Aluno</h2>
                <div class="form-group">
                    <label for="scanned-code">Código Escaneado:</label>
                    <input type="text" id="scanned-code" readonly placeholder="Aguardando leitura...">
                </div>

                <div class="form-group">
                    <label for="turma-select">1. Selecione a Turma:</label>
                    <select id="turma-select">
                        <option value="">Carregando turmas...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="student-select">2. Selecione o Aluno:</label>
                    <select id="student-select" disabled>
                        <option value="">Aguardando seleção da turma...</option>
                    </select>
                </div>
                <button id="assign-button" disabled>
                    <i class="fas fa-link"></i> Vincular Código
                </button>
            </div>
        </main>
    </div>
    <script src="qr_admin.js"></script>
</body>

</html>
